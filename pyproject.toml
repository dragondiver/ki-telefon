[project]
name = "kitelefon"
version = "0.1.0"
description = "KI-Telefon — retro telephone with OpenAI Realtime API and async task delegation"
requires-python = ">=3.11"
dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "websockets>=12.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "requests>=2.31",
    "anthropic>=1.2.0",
    "psycopg[binary]>=3.2",
    "sprachkurs",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16",
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
]
pi = [
    "gpiozero>=2.0",
    "lgpio>=0.2",
]

[project.scripts]
kitelefon = "kitelefon.__main__:main"

[tool.uv.sources]
# Fester Commit statt Pfad-Abhängigkeit (telefon-ai#81): Der Lock hängt nicht an
# sprachkurs-main, neue Camille-Stände kommen bewusst durch Anheben von `rev`.
# Mac und Pi holen per SSH (git config url.…insteadOf), die CI per Token.
sprachkurs = { git = "https://github.com/dragondiver/sprachkurs", rev = "b190babea320bebdbe31c676ee6a19c14c5c73a2" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kitelefon"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: hits the real OpenAI API; default-skipped",
    "pi: requires Raspberry Pi hardware",
]
addopts = "-m 'not live and not pi'"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["*.md"]  # ruff 0.16 formatiert sonst Codeblöcke in Markdown

[tool.ruff.lint]
# E/F: Fehler und Pyflakes · I: Import-Reihenfolge · UP: moderne Syntax · B: typische Fallen
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # Zeilenlänge regelt der Formatierer
    "UP042", # str+Enum → StrEnum ändert str()-Verhalten; bewusst so gelassen
]

[tool.ruff.lint.per-file-ignores]
# Diese Module richten Logging/Umgebung ein, bevor sie importieren — Absicht.
"src/kitelefon/__main__.py" = ["E402"]
"src/kitelefon/call_manager.py" = ["E402"]
"src/kitelefon/realtime.py" = ["E402"]
